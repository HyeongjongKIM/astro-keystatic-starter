packages:
  - apps/*
  - packages/*

minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.4.6'
  - '@astrojs/internal-helpers@0.13.1'
  - '@astrojs/markdoc@2.1.3'
  - '@astrojs/markdown-satteri@0.4.7'
  - '@astrojs/react@7.1.4'
  - astro@7.4.7
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
  - '@astrojs/mdx@8.1.3'

allowBuilds:
  esbuild@0.28.2: true
  workerd@1.20261101.1: true
  workerd@1.20261104.1: true

# markdown-it 12 declarations require the LinkifyIt namespace removed in newer types.
# This selector affects only that legacy declaration package, not runtime linkify-it.
overrides:
  '@types/markdown-it@12.2.3>@types/linkify-it': 3.0.5
