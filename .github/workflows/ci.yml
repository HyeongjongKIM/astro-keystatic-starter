name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          COMMIT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMIT_TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$COMMIT_FROM" --to "$COMMIT_TO" --verbose
      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          COMMIT_FROM: ${{ github.event.before }}
          COMMIT_TO: ${{ github.sha }}
        run: |
          if [ "$COMMIT_FROM" = "0000000000000000000000000000000000000000" ]; then
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$COMMIT_FROM" --to "$COMMIT_TO" --verbose
          fi
      - run: pnpm check
