name: CI
on:
  push:
    branches: [dev, content, main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Recover current head: both means all available apps (content is Site only)'
        type: choice
        default: both
        options: [both, site, admin]
permissions:
  contents: read
env:
  HUSKY: '0'
jobs:
  prepare:
    name: Classify and validate
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.plan.outputs.site }}
      admin: ${{ steps.plan.outputs.admin }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        run: node scripts/ci/run.mjs plan
      - run: node scripts/publishing/run.mjs guard
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_APP_BOT: ${{ vars.PROMOTION_APP_BOT }}
      - run: node scripts/ci/run.mjs commits
      - run: pnpm format:check
      - run: node scripts/ci/run.mjs docs
      - if: steps.plan.outputs.lint == 'true'
        run: pnpm lint
      - if: steps.plan.outputs.test == 'true'
        run: pnpm test
  site:
    name: Validate Site
    needs: prepare
    if: needs.prepare.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && vars.PRODUCTION_PUBLIC_SITE_URL || github.ref_name == 'main' && vars.PRODUCTION_PUBLIC_SITE_URL || github.ref_name == 'content' && vars.CONTENT_PUBLIC_SITE_URL || vars.PREVIEW_PUBLIC_SITE_URL || 'https://example.com' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @starter/site typecheck
      - run: pnpm build:site
      - run: pnpm verify:site
      - name: Prepare validated static output
        run: |
          mkdir -p output/site-artifact
          cp -R apps/site/dist output/site-artifact/dist
          printf '%s' "$PUBLIC_SITE_URL" > output/site-artifact/origin.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: validated-site
          path: output/site-artifact/
          retention-days: 7
  admin:
    name: Validate Admin
    needs: prepare
    if: needs.prepare.outputs.admin == 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTATIC_GITHUB_REPO: ${{ vars.KEYSTATIC_GITHUB_REPO || github.repository }}
      ADMIN_BRAND_NAME: ${{ vars.ADMIN_BRAND_NAME }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @starter/admin typecheck
      - run: pnpm build:admin:preview
        env:
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.PREVIEW_KEYSTATIC_GITHUB_APP_SLUG || 'unconfigured-preview' }}
      - run: pnpm build:admin:production
        env:
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.PRODUCTION_KEYSTATIC_GITHUB_APP_SLUG || 'unconfigured-production' }}
  required:
    name: Required checks
    needs: [prepare, site, admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
      - run: node scripts/ci/run.mjs gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
  deploy-site:
    name: Deploy Site
    needs: [prepare, required]
    if: >-
      !cancelled() && needs.required.result == 'success' && needs.prepare.outputs.site == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'dev' || github.ref_name == 'content' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'content' && 'content' || 'preview' }}
    concurrency:
      group: deploy-site-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      DEPLOY_APP: site
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: validated-site
          path: output/site-artifact
      - name: Verify build origin and deployment head
        run: |
          node scripts/ci/run.mjs deploy-guard
          node --input-type=module -e "import {readFileSync} from 'node:fs'; if (readFileSync('output/site-artifact/origin.txt', 'utf8') !== process.env.PUBLIC_SITE_URL) throw new Error('Site origin differs from validated build');"
      - name: Upload validated Site
        run: pnpm --filter @starter/admin exec node ../../scripts/ci/run.mjs upload-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  deploy-admin:
    name: Deploy Admin
    needs: [prepare, required]
    if: >-
      !cancelled() && needs.required.result == 'success' && needs.prepare.outputs.admin == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    concurrency:
      group: deploy-admin-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KEYSTATIC_GITHUB_REPO: ${{ vars.KEYSTATIC_GITHUB_REPO }}
      PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
      ADMIN_BRAND_NAME: ${{ vars.ADMIN_BRAND_NAME }}
      DEPLOY_APP: admin
      DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify deployment head
        run: node scripts/ci/run.mjs deploy-guard
      - name: Build matching Admin mode
        run: pnpm "build:admin:$DEPLOY_TARGET"
      - name: Recheck head and deploy Admin
        run: |
          node scripts/ci/run.mjs deploy-guard
          pnpm --filter @starter/admin exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  deployment-summary:
    name: Deployment outcome and recovery
    needs: [prepare, required, deploy-site, deploy-admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
      - run: node scripts/ci/run.mjs deployment-summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
