name: Install workspace
description: Use the repository's pinned tooling and frozen lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.1
      with:
        version: 12.18.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 22.23.5
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: '0'
